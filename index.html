<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うちのレシピ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: レシピページと同じ配色・書体。カテゴリごとにカードを並べた目次 */
:root{
  --bg:#f6f4ef; --surface:#fffdf8; --fg:#2a2620; --muted:#6f685c;
  --line:#e2ddd2; --accent:#a8541f; --accent-soft:#f3e4d6; --tag:#5d6b3a;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1916; --surface:#24211d; --fg:#ece6da; --muted:#a69e90;
  --line:#3a352e; --accent:#e08b52; --accent-soft:#3a2a1e; --tag:#a9b97c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1916; --surface:#24211d; --fg:#ece6da; --muted:#a69e90;
  --line:#3a352e; --accent:#e08b52; --accent-soft:#3a2a1e; --tag:#a9b97c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px;margin:0}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:8px}
.kicker{font-size:13px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.3;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;flex:1;min-width:0}
.item .s{display:block;font-size:13px;color:var(--muted);font-weight:400}
.item .arrow{color:var(--accent);font-size:18px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">RECIPES</div>
    <h1>うちのレシピ</h1>
  </header>

  <section>
    <h2>ご飯もの</h2>
    <ul>
      <li><a class="item" href="recipes/takikomi-gohan.html">
        <span class="t">鶏としめじの炊き込みご飯<span class="s">米3合・炊飯器</span></span>
        <span class="arrow">›</span>
      </a></li>
    </ul>
  </section>

  <section>
    <h2>汁もの</h2>
    <ul>
      <li><a class="item" href="recipes/tonjiru.html">
        <span class="t">豚汁<span class="s">水700cc・3〜4人分</span></span>
        <span class="arrow">›</span>
      </a></li>
    </ul>
  </section>
</div>
</body>
</html>
